name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test Python modules
      run: |
        python -c "import link_checker; import format_results; print('Modules imported successfully')"
        python link_checker.py --help
        
    - name: Run Python module tests
      run: |
        cd tests
        python test_modules.py

    - name: Run bot-blocking tests
      run: |
        cd tests
        python test_bot_blocking.py

  test-action:
    runs-on: ubuntu-latest
    name: Test Link Checker Action
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Test action with real test files
      id: test-mixed
      continue-on-error: true
      uses: ./
      with:
        html-path: 'tests'
        fail-on-broken: 'false'
        create-artifact: 'true'
        artifact-name: 'test-link-report'
        timeout: 30
        
    - name: Verify action ran successfully
      run: |
        echo "Action completed with output: ${{ steps.test-mixed.outputs.broken-links-found }}"
        
    # Informational, like the scan below it. A clean page is asserted against
    # the local server instead, so this no longer has to gate on github.com,
    # python.org, jupyter.org and docs.python.org all staying redirect-free.
    - name: Live scan of known-good links (informational, does not gate)
      continue-on-error: true
      uses: ./
      with:
        html-path: 'tests/good-links.html'
        fail-on-broken: 'true'

    # Informational only, and expected to report findings: the fixture holds
    # a deliberately unreachable host and three deliberate redirects.
    #
    # fail-on-broken is false so that no PR comment is posted. Its findings
    # are true by construction, so a comment about them says the same thing
    # on every run and therefore says nothing. The check-own-docs job below
    # exercises the comment path against links that can actually rot.
    - name: Live smoke scan (informational, does not gate)
      continue-on-error: true
      uses: ./
      with:
        html-path: 'tests/broken-links.html'
        fail-on-broken: 'false'
        timeout: 30

    # A real 200 over real HTTP was the one thing only a public site could
    # give us: every other deterministic fixture either skips the request
    # (ignore-patterns) or fails transport (.invalid). Serving it from
    # localhost keeps that coverage and removes the dependency, which is what
    # lets every gating step in this job be offline.
    #
    # The routes also make the status-code paths assertable end to end for the
    # first time. That is what the httpstat.us fixture was for, before the
    # service stopped answering and took the coverage with it.
    - name: Serve fixtures from localhost
      run: |
        mkdir -p ci-server ci-fixtures-clean ci-fixtures-redirect ci-fixtures-missing

        cat > ci-server/serve.py <<'PY'
        from http.server import BaseHTTPRequestHandler, HTTPServer

        # Every path the generated fixtures link to, and nothing else. The
        # table is exhaustive on purpose: answering 200 to whatever is asked
        # would let a typo in a fixture, or a regression that mangled the URL
        # before the request, pass as a clean page.
        ROUTES = {'/ok': 200, '/ok/two': 200, '/missing': 404}

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                path = self.path.split('?')[0]
                if path == '/moved':
                    self.send_response(301)
                    self.send_header('Location', '/ok')
                    self.end_headers()
                    return
                # An unregistered path means the fixtures and this table have
                # drifted. 500 rather than 404 so that silent-codes: '404'
                # cannot suppress it -- every assertion below goes red on a
                # request nobody intended, instead of one of them passing.
                status = ROUTES.get(path, 500)
                body = b'<html><body>ok</body></html>'
                if status == 500:
                    body = b'<html><body>no such fixture route</body></html>'
                self.send_response(status)
                self.send_header('Content-Type', 'text/html')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)

            def log_message(self, *args):
                pass

        HTTPServer(('127.0.0.1', 8123), Handler).serve_forever()
        PY

        nohup python3 ci-server/serve.py >/dev/null 2>&1 &
        for i in $(seq 1 40); do
          curl -sf http://127.0.0.1:8123/ok >/dev/null && break
          sleep 0.25
        done
        if ! curl -sf http://127.0.0.1:8123/ok >/dev/null; then
          echo "::error::local fixture server did not come up on 127.0.0.1:8123"
          exit 1
        fi
        echo "local fixture server ready"

        cat > ci-fixtures-clean/clean.html <<'HTML'
        <html><body>
        <a href="http://127.0.0.1:8123/ok">Fine</a>
        <a href="http://127.0.0.1:8123/ok/two">Also fine</a>
        </body></html>
        HTML

        cat > ci-fixtures-redirect/moved.html <<'HTML'
        <html><body>
        <a href="http://127.0.0.1:8123/moved">Moved</a>
        </body></html>
        HTML

        cat > ci-fixtures-missing/missing.html <<'HTML'
        <html><body>
        <a href="http://127.0.0.1:8123/missing">Gone</a>
        </body></html>
        HTML

    # fail-on-broken is deliberately true: a clean page must exit 0 on its own,
    # without waiting for the assertions at the end of the job.
    - name: A clean page passes end to end
      id: local-clean
      uses: ./
      with:
        html-path: 'ci-fixtures-clean'
        fail-on-broken: 'true'
        ai-suggestions: 'false'
        timeout: 10

    - name: A redirect is followed and counted
      id: local-redirect
      uses: ./
      with:
        html-path: 'ci-fixtures-redirect'
        fail-on-broken: 'false'
        ai-suggestions: 'false'
        timeout: 10

    - name: An error status is reported
      id: local-missing
      uses: ./
      with:
        html-path: 'ci-fixtures-missing'
        fail-on-broken: 'false'
        ai-suggestions: 'false'
        timeout: 10

    - name: silent-codes suppresses that error status
      id: local-silenced
      uses: ./
      with:
        html-path: 'ci-fixtures-missing'
        fail-on-broken: 'true'
        ai-suggestions: 'false'
        timeout: 10
        silent-codes: '404'

    # Status 0 is what the checker reports when a request never reaches the
    # server. .invalid is reserved by RFC 2606 and can never resolve, so these
    # two links fail transport on every run, immediately and without contacting
    # anything. That makes silent-codes '0' testable without a live host --
    # which is what the old httpstat.us fixture was trying and failing to do.
    - name: Create unreachable-host fixture
      run: |
        mkdir -p ci-fixtures-unreachable
        cat > ci-fixtures-unreachable/unreachable.html <<'HTML'
        <html><body>
        <a href="https://host-one.invalid/">One</a>
        <a href="https://host-two.invalid/page">Two</a>
        </body></html>
        HTML

    - name: Unreachable hosts are reported by default
      id: unreachable-loud
      uses: ./
      with:
        html-path: 'ci-fixtures-unreachable'
        fail-on-broken: 'false'
        ai-suggestions: 'false'
        timeout: 10

    # fail-on-broken is deliberately true here: if status-0 silencing ever
    # regresses, this step fails on its own rather than waiting for the
    # assertions below.
    - name: silent-codes 0 suppresses unreachable hosts
      id: unreachable-quiet
      uses: ./
      with:
        html-path: 'ci-fixtures-unreachable'
        fail-on-broken: 'true'
        ai-suggestions: 'false'
        timeout: 10
        silent-codes: '0,403,503'

    # The ignore-patterns fixture is built here rather than kept in tests/ so
    # that the counts below are exact and the other jobs keep scanning the
    # same files they always have. Every host is under .invalid, which is
    # reserved and never resolves, so the ignored case makes no requests at
    # all and the un-ignored case fails fast.
    - name: Create ignore-patterns fixture
      run: |
        mkdir -p ci-fixtures
        cat > ci-fixtures/ignore-patterns.html <<'HTML'
        <html><body>
        <a href="https://fred.stlouisfed.org.invalid/">FRED</a>
        <a href="https://fred.stlouisfed.org.invalid/series/UNRATE">UNRATE</a>
        <a href="https://blocked.example.invalid/page">Blocked</a>
        </body></html>
        HTML

    - name: Test ignore-patterns skips matching links
      id: test-ignored
      uses: ./
      with:
        html-path: 'ci-fixtures'
        fail-on-broken: 'true'
        ai-suggestions: 'false'
        timeout: 10
        ignore-patterns: |
          https://fred\.stlouisfed\.org\.invalid/.*
          # comments and blank lines are skipped

          blocked\.example\.invalid

    - name: Test ignore-patterns off reports the same links
      id: test-not-ignored
      uses: ./
      with:
        html-path: 'ci-fixtures'
        fail-on-broken: 'false'
        ai-suggestions: 'false'
        timeout: 10

    - name: Verify action outputs
      run: |
        assert() {
          if [ "$2" != "$3" ]; then
            echo "::error::$1: expected '$3', got '$2'"
            exit 1
          fi
          echo "ok: $1 = $2"
        }
        assert "ignored-count with patterns"        "${{ steps.test-ignored.outputs.ignored-count }}"          "3"
        assert "broken-link-count with patterns"    "${{ steps.test-ignored.outputs.broken-link-count }}"      "0"
        assert "broken-links-found with patterns"   "${{ steps.test-ignored.outputs.broken-links-found }}"     "false"
        assert "ignored-count without patterns"     "${{ steps.test-not-ignored.outputs.ignored-count }}"      "0"
        assert "broken-link-count without patterns" "${{ steps.test-not-ignored.outputs.broken-link-count }}"  "3"
        assert "unreachable reported by default"    "${{ steps.unreachable-loud.outputs.broken-link-count }}"  "2"
        assert "unreachable found by default"       "${{ steps.unreachable-loud.outputs.broken-links-found }}" "true"
        assert "unreachable silenced by code 0"     "${{ steps.unreachable-quiet.outputs.broken-link-count }}" "0"
        assert "no findings once silenced"          "${{ steps.unreachable-quiet.outputs.broken-links-found }}" "false"
        assert "clean page has no broken links"     "${{ steps.local-clean.outputs.broken-link-count }}"       "0"
        assert "clean page reports nothing"         "${{ steps.local-clean.outputs.broken-links-found }}"      "false"
        assert "redirect counted"                   "${{ steps.local-redirect.outputs.redirect-count }}"       "1"
        assert "redirect is not broken"             "${{ steps.local-redirect.outputs.broken-link-count }}"    "0"
        assert "error status reported"              "${{ steps.local-missing.outputs.broken-link-count }}"     "1"
        assert "error status silenced by 404"       "${{ steps.local-silenced.outputs.broken-link-count }}"    "0"
        assert "nothing found once 404 silenced"    "${{ steps.local-silenced.outputs.broken-links-found }}"   "false"

    - name: Stop the local fixture server
      if: always()
      run: pkill -f ci-server/serve.py || true

  test-empty-directory:
    runs-on: ubuntu-latest
    name: Test Empty Directory
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      
    - name: Create empty directory
      run: mkdir -p empty-html
      
    - name: Test action on empty directory
      uses: ./
      with:
        html-path: 'empty-html'

  # Dogfooding, and the only place a PR comment is worth posting. The links
  # here are real ones in our own documentation, so a finding names a link we
  # publish that came back broken. When the docs are clean there are no
  # findings, broken-links-found stays false and no comment is posted at all
  # -- which is the point. A comment that appears on every run carries no
  # information.
  #
  # This action reads HTML, so the Markdown is rendered first. Rendering also
  # does the filtering for free: the placeholder URLs in the usage examples
  # live inside fenced code blocks and never become anchors, so only genuine
  # links are checked.
  check-own-docs:
    runs-on: ubuntu-latest
    name: Check links in our own docs

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Render the Markdown docs to HTML
      run: |
        python3 -m pip install --quiet markdown
        mkdir -p docs-html
        python3 - <<'PY'
        import markdown, pathlib

        out = pathlib.Path('docs-html')
        sources = sorted(pathlib.Path('.').glob('*.md')) + [pathlib.Path('tests/README.md')]
        for src in sources:
            html = markdown.markdown(src.read_text(encoding='utf-8'),
                                     extensions=['fenced_code', 'tables'])
            dest = out / (src.as_posix().replace('/', '__') + '.html')
            dest.write_text('<html><body>' + html + '</body></html>', encoding='utf-8')
            print('rendered', src)
        PY

    # continue-on-error because an outage at one of the linked sites is not a
    # reason to fail this repository's build. The PR comment is the signal.
    #
    # Status 0 is silenced. From a runner a transport failure cannot be told
    # apart from a host that is simply down or throttling this IP range, and
    # neither keepachangelog.com nor semver.org is on the legitimate_domains
    # allowance, so a blip at either would otherwise post a comment about a
    # link that is fine. A real 404 -- the class that found the dead
    # Marketplace badge -- is unaffected. The cost is that a domain which
    # disappears outright goes unreported here.
    - name: Check the links in the rendered docs
      id: docs
      continue-on-error: true
      uses: ./
      with:
        html-path: 'docs-html'
        fail-on-broken: 'true'
        silent-codes: '0,403,503'
        timeout: 20

    - name: Report
      run: |
        echo "broken:   ${{ steps.docs.outputs.broken-link-count }}"
        echo "redirects: ${{ steps.docs.outputs.redirect-count }}"
        if [ "${{ steps.docs.outputs.broken-links-found }}" = "true" ]; then
          echo "::warning::A link in our own documentation came back broken -- see the PR comment"
        fi